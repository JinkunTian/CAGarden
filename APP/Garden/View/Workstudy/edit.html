<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="format-detection" content="telephone=no"><title>编辑勤工助学项目 - {:C('SITE_NAME')}</title><include file="Workstudy:assets" /></head>
<body class="workstudy-page"><div class="container"><include file="Common:header" /></div>
<main class="ws-main ws-narrow"><header class="ws-header"><div><h1><if condition="$is_new">新建<else />编辑</if>勤工助学项目</h1><p class="ws-sub">项目介绍、报名开关和模板版本分别设置。</p></div></header><section class="ws-card">
<form action="{:U('/Garden/Workstudy/save')}" method="post" data-workstudy-submit><input type="hidden" name="csrf_token" value="{$csrf_token}"><notempty name="project.wid"><input type="hidden" name="wid" value="{$project.wid}"></notempty>
<div class="ws-field"><label for="wname">项目名称</label><input id="wname" name="wname" value="{$project.wname|htmlspecialchars}" required maxlength="100" placeholder="例如：2026 年秋季勤工助学"></div>
<div class="ws-fields"><div class="ws-field"><label for="year">年度 / 学期</label><input id="year" name="year" value="{$project.year|htmlspecialchars}" required maxlength="32" placeholder="例如：2026-2027 学年"></div><div class="ws-field"><label for="status">报名状态</label><select id="status" name="status"><option value="2" <if condition="$project['status'] eq 2">selected</if>>已结束 · 保留前台项目和历史报名</option><option value="1" <if condition="$project['status'] eq 1">selected</if>>开放报名 · 允许新增和修改</option><option value="3" <if condition="$project['status'] eq 3">selected</if>>已归档 · 仅保留学生自己的历史报名入口</option></select></div></div>
<div class="ws-field"><label for="description">项目介绍 / 招募公告</label><textarea id="description" name="description" maxlength="2000" placeholder="填写岗位要求、报名说明和通知方式">{$project.description|htmlspecialchars}</textarea><p class="ws-help">显示在前台项目卡片上。</p></div>
<div class="ws-field"><label for="message">提交成功提示</label><textarea id="message" name="message" maxlength="1000" placeholder="例如：报名表已收到，请留意后续通知。">{$project.message|htmlspecialchars}</textarea><p class="ws-help">仅在报名保存成功后显示。留空使用默认提示。</p></div>
<div class="ws-field"><label for="template_id">本项目 Word 模板</label><select id="template_id" name="template_id" required><option value="">请选择模板版本</option><volist name="templates" id="template"><option value="{$template.tid}" <if condition="$template['tid'] eq $project['template_id']">selected</if>>#{$template.tid} · {$template.version_label|htmlspecialchars} · {$template.file_name|htmlspecialchars}</option></volist></select><p class="ws-help">仅本项目使用所选版本。<notempty name="project.wid"><a href="{:U('/Garden/Workstudy/templateManage',array('wid'=>$project['wid']))}">上传并替换本项目模板</a><else /><a href="{:U('/Garden/Workstudy/templateManage')}">上传新模板到模板库</a></notempty></p></div>
<div class="ws-actions"><button class="btn btn-primary" type="submit">保存项目</button><a class="btn btn-default" href="{:U('/Garden/Workstudy')}">返回管理</a></div></form></section></main><script src="__PUBLIC__/js/index.js"></script><script src="__PUBLIC__/js/workstudy.js?v=20261004-fix1"></script></body></html>
